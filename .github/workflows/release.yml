name: Release CLI tools

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          for tool_dir in tools/*; do
            [[ -d "$tool_dir" ]] || continue
            python3 build.py "$(basename "$tool_dir")"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --generate-notes
